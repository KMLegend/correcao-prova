# fly.toml app configuration file generated for correcao-prova
app = "correcao-prova"
primary_region = "gru"

[http_service]
  internal_port = 8080
  force_https = True
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
